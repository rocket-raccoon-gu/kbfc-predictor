<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>KBFC result desk</title>
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="/kbfc.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <img class="crest" src="/kbfc.png" alt="Kerala Blasters" />
          <div>
            <p class="eyebrow">Result desk</p>
            <h1>Full-time scores</h1>
          </div>
        </div>
      </header>
      <p id="banner" class="banner" hidden></p>
      <section id="lock" class="card identity">
        <label>
          Admin PIN
          <input id="pin" type="password" autocomplete="current-password" placeholder="PIN" />
        </label>
        <button type="button" id="unlock" class="btn">Unlock</button>
      </section>
      <main id="app"></main>
      <footer>
        <a href="/">Back to predictions</a>
      </footer>
    </div>
    <script src="/admin.js"></script>
  </body>
</html>
